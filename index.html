<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GFS بالعربي أحلى</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script>
      (() => {
        let bypassOnce = false;
        let statsTimer = null;

        const normalizeName = (value = "") => String(value)
          .normalize("NFKC")
          .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
          .replace(/ـ/g, "")
          .replace(/[أإآٱ]/g, "ا")
          .replace(/ى/g, "ي")
          .trim()
          .replace(/\s+/g, " ")
          .toLowerCase();

        const nameParts = (value) => normalizeName(value).split(" ").filter(Boolean);

        function setReactInputValue(input, value) {
          const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value")?.set;
          if (setter) setter.call(input, value); else input.value = value;
          input.dispatchEvent(new Event("input", { bubbles: true }));
          input.dispatchEvent(new Event("change", { bubbles: true }));
        }

        function showCompatError(message) {
          const sidInput = document.getElementById("sid");
          if (!sidInput) return;
          let box = document.getElementById("student-name-compat-error");
          if (!box) {
            box = document.createElement("div");
            box.id = "student-name-compat-error";
            box.style.color = "#A6402F";
            box.style.fontSize = "13px";
            box.style.marginTop = "6px";
            sidInput.parentElement?.insertAdjacentElement("afterend", box);
          }
          box.textContent = message;
        }

        function clearCompatError() {
          const box = document.getElementById("student-name-compat-error");
          if (box) box.remove();
        }

        async function resolveRegisteredName(name, sid) {
          try {
            const r = await fetch("/api/student-resolve", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, sid })
            });
            const data = await r.json().catch(() => ({}));
            if (r.ok && data?.ok && data?.fullName) return { ok: true, fullName: data.fullName };
            if (r.status === 409) return { ok: false, message: "يوجد أكثر من طالب مطابق. تحقّق من الرقم المدرسي أو راجع معلمك." };
            if (r.status === 404) return { ok: false, message: "الاسم لا يطابق الطالب المسجّل لهذا الرقم. اكتب أول اسمين أو أكثر بالترتيب نفسه المسجّل في المنصة." };
            return { ok: false, message: "تعذّر التحقق من بيانات الطالب الآن. حاول مرة أخرى." };
          } catch {
            return { ok: false, message: "تعذّر الاتصال بخدمة التحقق. حاول مرة أخرى." };
          }
        }

        function refreshStudentNameLabel() {
          const input = document.getElementById("nm");
          if (!input) return;
          const label = document.querySelector('label[for="nm"]');
          if (label) label.textContent = "اسم الطالب (اسمين أو أكثر حتى الاسم الكامل)";
          input.placeholder = "اكتب أول اسمين أو أكثر كما هي مسجّلة في المنصة";
        }

        function num(v) {
          return Number.isFinite(Number(v)) ? Number(v).toLocaleString("ar-AE") : "—";
        }

        function applyLiveStats(stats) {
          const activeEls = document.querySelectorAll(".lx-active strong, .lx-live-sub");
          activeEls.forEach((el) => {
            if (el.classList.contains("lx-live-sub")) el.textContent = `${num(stats.activeNow)} متعلمًا نشطًا الآن`;
            else el.textContent = num(stats.activeNow);
          });

          const tierData = [stats.tiers?.advanced, stats.tiers?.progressing, stats.tiers?.support];
          document.querySelectorAll(".lx-tier").forEach((el, i) => {
            const t = tierData[i];
            if (!t) return;
            const strong = el.querySelector("strong");
            const small = el.querySelector("small");
            if (strong) strong.textContent = `${t.pct}%`;
            if (small) small.textContent = `${num(t.count)} طالب`;
            const ring = el.querySelector(".lx-ring");
            if (ring) ring.style.setProperty("--p", t.pct);
          });

          document.querySelectorAll(".lh-stats .lh-stat").forEach((el) => {
            const label = (el.querySelector("span")?.textContent || "").trim();
            const value = el.querySelector("b");
            if (!value) return;
            if (label.includes("طالب")) value.textContent = num(stats.students);
            else if (label.includes("كورس")) value.textContent = num(stats.publishedCourses);
            else if (label.includes("شهادة")) value.textContent = num(stats.certificates);
          });

          const note = document.querySelector(".lh-gauge-note");
          if (note) note.textContent = `نسبة إنجاز الطلاب لكورساتهم المُسنَدة (${num(stats.studentsWithAssignedCourses)} طالب لديهم كورسات)`;
        }

        async function refreshStats() {
          try {
            const r = await fetch(`/api/public-stats?t=${Date.now()}`, { cache: "no-store" });
            if (!r.ok) return;
            const data = await r.json();
            if (!data || data.error) return;
            applyLiveStats(data);
          } catch {}
        }

        let refreshQueued = false;
        const observer = new MutationObserver(() => {
          if (refreshQueued) return;
          refreshQueued = true;
          requestAnimationFrame(() => {
            refreshQueued = false;
            refreshStudentNameLabel();
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        document.addEventListener("DOMContentLoaded", () => {
          refreshStudentNameLabel();
          refreshStats();
          statsTimer = setInterval(refreshStats, 30000);
        });

        document.addEventListener("click", async (event) => {
          const button = event.target.closest("button");
          if (!button) return;
          if (bypassOnce) {
            bypassOnce = false;
            return;
          }

          const input = document.getElementById("nm");
          const sidInput = document.getElementById("sid");
          if (!input || !sidInput || !button.closest(".lh-panel")) return;

          const entered = input.value;
          const parts = nameParts(entered);
          const sid = sidInput.value;

          if (parts.length < 2) return;
          if (!/^\d{6}$/.test(sid)) return;

          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          clearCompatError();
          button.disabled = true;

          const result = await resolveRegisteredName(entered, sid);
          button.disabled = false;

          if (!result.ok) {
            showCompatError(result.message);
            return;
          }

          // بعد التحقق من الاسم المختصر والرقم المدرسي، نمرّر الاسم الكامل
          // المسجّل إلى واجهة React القديمة حتى لا ترفض الاسم الثنائي/الثلاثي.
          const safeLoginName = String(result.fullName).trim();
          setReactInputValue(input, safeLoginName);
          setTimeout(() => {
            bypassOnce = true;
            button.click();
          }, 120);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/course-content-upgrade.js" defer></script>
  </body>
</html>
