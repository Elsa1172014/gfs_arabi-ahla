-radius:18px;padding:20px;background:#fcfdff;overflow:hidden}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.qbadge{background:#eef3ff;color:#173e9c;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}.qtitle{font-size:18px;font-weight:900;margin-top:6px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.opt,.tf,.order,.verify,.move{font:inherit;border-radius:12px;padding:11px 13px;cursor:pointer}.opt,.tf,.order{border:1px solid #d9e0eb;background:#fff;text-align:right;transition:.2s}.opt:hover,.tf:hover,.order:hover{transform:translateY(-1px);border-color:#9cacc8}.opt.sel,.tf.sel,.order.sel{background:#eef3ff;border-color:#173e9c;box-shadow:0 0 0 3px #173e9c12}.verify{border:0;background:linear-gradient(135deg,#173e9c,#112d73);color:#fff;font-weight:900;min-width:130px;margin-top:14px;box-shadow:0 10px 22px #173e9c33}.verify:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.input{width:100%;padding:12px 14px;border:1px solid #d9e0eb;border-radius:12px;margin-top:12px;font:inherit}.feedback{position:absolute;left:18px;top:18px;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900;opacity:0;transform:translateY(-6px);transition:.22s}.feedback.ok{opacity:1;transform:none;background:#eaf8f0;color:#0d7c4b}.feedback.no{opacity:1;transform:none;background:#fff0f0;color:#ae2830}.counter{text-align:center;color:#71809a;margin-bottom:6px}.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:18px}.dot{width:9px;height:9px;border-radius:50%;background:#dfe4ec}.dot.on{background:#173e9c;transform:scale(1.35)}.dot.done{background:#8b2532}.sim{display:grid;grid-template-columns:1fr 1fr;gap:14px}.moves{display:flex;gap:8px;flex-wrap:wrap}.move{width:54px;height:54px;border:2px solid #dfe5ef;background:white;font-size:22px}.move.on{border-color:#173e9c;background:#eef3ff}.seat{text-align:center;font-size:76px;font-weight:900;background:linear-gradient(145deg,#fff,#f2f6f   <section class="courseHead"><div class="headGrid"><div><h1>الهمزة المتوسطة</h1><div class="meta">إملاء ورسم · الصف 10</div><div class="objective">أن يرسم الطالب الهمزة المتوسطة على صورتها الصحيحة معللًا اختياره باستخدام قاعدة أقوى الحركتين.</div><div class="bar"><i id="bar"></i></div></div><div class="progressBox"><div class="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="48"></circle><circle id="ringValue" class="value" cx="60" cy="60" r="48"></circle></svg><div id="pct" class="pct">0%</div></div><div class="stats">الأسئلة النهائية: <b>25</b><br>النجاح: <b>70%</b><br>المحاولات: <b id="attemptsText">0 من 4</b><div class="tiny">التعلم 60% + الاختبار النهائي 40%</div></div></div></div></section>
  <main id="app"></main>
</div></div>
<script>
(()=>{
const names=['مقدمة وتمهيد','الفيديو والفهم','أقوى الحركتين','على الألف','على الواو','على الياء','حالات خاصة','خريطة المفاهيم','محاكاة وتطبيق','الاختبار النهائي'];
let stage=0,check=0,attempts=0,quizIndex=0,quizScore=0,selected=null,hm='ْ',pm='ُ';const done=new Set();const strength={'ِ':4,'ُ':3,'َ':2,'ْ':1},seat={4:'ئ',3:'ؤ',2:'أ',1:'ء'};
const lesson=[
{html:`<span class="eyebrow">1 · اكتشف</span><h2 class="title">ابدأ بالملاحظة لا بالحفظ</h2><div class="visualStrip"><div class="visual"><div><div class="big">🕳️</div><b>بِئْر</b></div></div><div class="visual"><div><div class="big">👤</div><b>مُؤْمِن</b></div></div><div class="visual"><div><div class="big">📝</div><b>مَسْأَلَة</b></div></div></div><div class="panel" style="margin-top:16px"><div class="flow"><span>أحدد حركة الهمزة</span><span>أحدد حركة ما قبلها</span><span>أقارن القوة</span><span>أختار الكرسي</span></div></div>`,checks:[{t:'mcq',q:'ما الذي نقارنه أولًا؟',o:['عدد الحروف','حركة الهمزة وحركة ما قبلها','آخر حرف','طول الكلمة'],a:1},{t:'tf',q:'شكل الهمزة المتوسطة يتغير عشوائيًا.',a:false},{t:'mcq',q:'أي كلمة تحتوي همزة على نبرة؟',o:['مؤمن','بئر','سأل','رؤية'],a:1}]},
{html:`<span class="eyebrow">2 · شاهد وافهم</span><h2 class="title">فيديو قصير ثم تحقق فوري</h2><div class="video"><iframe src="https://www.youtube.com/embed/N99RtSaAEj4" title="شرح الهمزة المتوسطة" allowfullscreen></iframe></div><p class="tiny">الإجابة الصحيحة فقط تفتح السؤال التالي. الخطأ يهز البطاقة ويطلب منك المحاولة مرة أخرى.</p>`,checks:[{t:'mcq',q:'ما الحركتان اللتان تدخلان في القرار؟',o:['الأولى والأخيرة','الهمزة وما قبلها','ما بعدها فقط','السكون فقط'],a:1},{t:'order',q:'رتب خطوات القرار.',o:['أحدد الحركتين','أقارن القوة','أختار الكرسي'],a:'0,1,2'}]},
{html:`<span class="eyebrow">3 · افهم القوة</span><h2 class="title">إنفوجرافيك أقوى الحركات</h2><div class="grid2"><div class="panel"><div class="strength"><div class="sbar s1">الكسرة<br>ئ</div><div class="sbar s2">الضمة<br>ؤ</div><div class="sbar s3">الفتحة<br>أ</div><div class="sbar s4">السكون</div></div></div><div class="panel"><h3>قاعدة ذكية في سطر واحد</h3><p>الكسرة أقوى، ثم الضمة، ثم الفتحة، ثم السكون. الحركة الأقوى هي التي تختار كرسي الهمزة.</p><div class="flow"><span>ِ = ئ</span><span>ُ = ؤ</span><span>َ = أ</span></div></div></div>`,checks:[{t:'mcq',q:'أي الحركات أقوى؟',o:['السكون','الفتحة','الضمة','الكسرة'],a:3},{t:'mcq',q:'أنا أقوى من الفتحة وأضعف من الكسرة. من أنا؟',o:['السكون','الضمة','الفتحة'],a:1}]},
{html:`<span class="eyebrow">4 · طبّق</span><h2 class="title">الهمزة على الألف</h2><div class="grid2"><div class="visual"><div><div class="big">❓</div><b>سَأَلَ</b></div></div><div class="panel"><p>إذا كانت الفتحة أقوى الحركتين، كان الكرسي هو الألف.</p><div class="flow"><span>فتحة</span><span>←</span><span>أ</span></div></div></div>`,checks:[{t:'mcq',q:'اختر الكلمة المكتوبة على الألف.',o:['بئر','سأل','مؤمن','فئة'],a:1},{t:'input',q:'أكمل الكلمة: مَسْـ...ـلَة',a:'أ'}]},
{html:`<span class="eyebrow">5 · طبّق</span><h2 class="title">الهمزة على الواو</h2><div class="grid2"><div class="visual"><div><div class="big">👁️</div><b>رُؤْيَة</b></div></div><div class="panel"><p>إذا كانت الضمة أقوى الحركتين، نكتب الهمزة على الواو.</p></div></div>`,checks:[{t:'mcq',q:'اختر الكلمة الصحيحة.',o:['مُأْمِن','مُؤْمِن','مُئْمِن','مُءْمِن'],a:1},{t:'tf',q:'الضمة يناسبها الواو.',a:true}]},
{html:`<span class="eyebrow">6 · طبّق</span><h2 class="title">الهمزة على الياء</h2><div class="grid2"><div class="visual"><div><div class="big">💧</div><b>بِئْر</b></div></div><div class="panel"><p>إذا كانت الكسرة أقوى الحركتين، نكتب الهمزة على نبرة (ئ).</p></div></div>`,checks:[{t:'mcq',q:'أي كلمة على نبرة؟',o:['رؤية','سأل','فئة','مؤمن'],a:2},{t:'input',q:'اكتب الكرسي المناسب للكسرة.',a:'ئ'}]},
{html:`<span class="eyebrow">7 · انتبه</span><h2 class="title">حالات خاصة</h2><div class="panel"><div class="flow"><span>قراءة</span><span>عباءة</span><span>مروءة</span></div><p>هناك كلمات تتأثر بحروف المد أو ترسم فيها الهمزة مفردة على السطر. افهم القاعدة ثم افحص الكلمة كاملة.</p></div>`,checks:[{t:'mcq',q:'أي كلمة تظهر فيها الهمزة منفردة على السطر؟',o:['سأل','قراءة','بئر','مؤمن'],a:1},{t:'tf',q:'نفحص الكلمة كاملة ولا نطبق القاعدة بشكل آلي.',a:true}]},
{html:`<span class="eyebrow">8 · لخّص</span><h2 class="title">خريطة المفاهيم في نظرة واحدة</h2><div class="map"><div><strong>ِ</strong>كسرة<br>ئ</div><div><strong>ُ</strong>ضمة<br>ؤ</div><div><strong>َ</strong>فتحة<br>أ</div><div><strong>ْ</strong>سكون<br>الأضعف</div></div><div class="flow" style="margin-top:14px"><span>حدد</span><span>قارن</span><span>اختر</span><span>علّل</span></div>`,checks:[{t:'match',q:'صل الحركة بالكرسي المناسب.',pairs:[['الكسرة','ئ'],['الضمة','ؤ'],['الفتحة','أ']]},{t:'order',q:'رتب خطوات القرار.',o:['حدد الحركتين','قارن القوة','اختر الكرسي'],a:'0,1,2'}]},
{html:`<span class="eyebrow">9 · جرّب</span><h2 class="title">محاكاة ميزان الهمزة</h2><div class="sim"><div class="panel"><b>حركة الهمزة</b><div class="moves" id="hmoves"></div><b>حركة ما قبلها</b><div class="moves" id="pmoves"></div></div><div class="seat" id="seat">ؤ</div></div>`,checks:[{t:'mcq',q:'همزة ساكنة وما قبلها مكسور: ما الكرسي؟',o:['أ','ؤ','ئ','ء'],a:2},{t:'mcq',q:'همزة مفتوحة وما قبلها مضموم: ما الأقوى؟',o:['الفتحة','الضمة','السكون','لا شيء'],a:1}]}
];
const totalChecks=lesson.reduce((n,s)=>n+s.checks.length,0);
const quiz=[['mcq','في «سُئِل» ما الحركة الأقوى؟',['الكسرة','الضمة','الفتحة','السكون'],0],['tf','الكسرة أقوى من الضمة.',null,true],['input','اكتب كرسي الضمة.',null,'ؤ'],['mcq','أي كلمة على الألف؟',['بئر','سأل','مؤمن','فئة'],1],['tf','السكون أقوى الحركات.',null,false],['input','اكتب كرسي الكسرة.',null,'ئ'],['mcq','أي كلمة على الواو؟',['رؤية','بئر','فئة','سأل'],0],['tf','نقارن حركة الهمزة وحركة ما قبلها.',null,true],['mcq','في «فئة» أي كرسي؟',['أ','ؤ','ئ','ء'],2],['input','اكتب كرسي الفتحة.',null,'أ'],['mcq','الترتيب الصحيح للقوة؟',['كسرة-ضمة-فتحة-سكون','ضمة-كسرة-فتحة-سكون','فتحة-ضمة-كسرة-سكون'],0],['tf','في «مؤمن» تناسب الضمة الواو.',null,true],['mcq','همزة ساكنة وما قبلها مفتوح:',['ئ','ؤ','أ','ء'],2],['input','صحح: مُئْمِن',null,'مؤمن'],['tf','في بئر تغلب الكسرة السكون.',null,true],['mcq','أيها على نبرة؟',['مسألة','فئة','رؤية','مؤمن'],1],['input','صحح: فأة',null,'فئة'],['tf','الحالة الخاصة قد تحتاج النظر إلى حروف المد.',null,true],['mcq','أيها حالة على السطر؟',['قراءة','بئر','سأل','مؤمن'],0],['input','اكتب الشكل الصحيح: رُ_ية',null,'ؤ'],['mcq','في مسألة الأقوى:',['السكون','الفتحة','الضمة','الكسرة'],1],['tf','يمكن اختيار الكرسي قبل تحديد الحركتين.',null,false],['mcq','الكرسي الموافق للضمة:',['أ','ؤ','ئ','ء'],1],['input','أكمل: بِ_ر',null,'ئ'],['mcq','الفكرة المركزية:',['الأقوى حركة يحدد الكرسي','الأطول يفوز','آخر حرف يحدد الكرسي'],0]];
function norm(s){return String(s||'').replace(/[ًٌٍَُِّْـ\s]/g,'').replace(/[إأآ]/g,'ا')}
function progress(){const learning=Math.round((done.size/totalChecks)*60);if(stage<9)return Math.min(60,learning);return Math.min(100,60+Math.round((quizIndex/25)*40))}
function top(){const p=progress(),c=2*Math.PI*48;document.getElementById('pct').textContent=p+'%';const r=document.getElementById('ringValue');r.style.strokeDasharray=c;r.style.strokeDashoffset=c*(1-p/100);document.getElementById('bar').style.width=p+'%';document.getElementById('attemptsText').textContent=attempts+' من 4';document.getElementById('steps').innerHTML=names.map((n,i)=>`<span class="step ${i===stage?'on':''} ${i<stage?'done':''}">${i+1}. ${n}</span>`).join('')}
function burst(){const b=document.createElement('div');b.className='successBurst';for(let i=0;i<18;i++){const s=document.createElement('i');s.className='spark';s.style.left='50%';s.style.top='54%';const a=Math.random()*Math.PI*2,d=70+Math.random()*120;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');b.appendChild(s)}document.body.appendChild(b);setTimeout(()=>b.remove(),700)}
function transition(fn){if(document.startViewTransition){document.startViewTransition(fn)}else{const s=document.querySelector('.stage');if(s){s.style.opacity='.2';s.style.transform='translateX(45px) scale(.98)'}setTimeout(fn,180)}}
function mark(){done.add(stage+'-'+check);top()}
function nextCheck(){transition(()=>{if(check+1<lesson[stage].checks.length){check++}else{stage++;check=0}selected=null;render()})}
function renderQuestion(q){let body='';if(q.t==='mcq')body=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;if(q.t==='tf')body=`<div class="opts"><button class="tf" data-v="true">صح</button><button class="tf" data-v="false">خطأ</button></div>`;if(q.t==='input')body=`<input id="ans" class="input" placeholder="اكتب الإجابة هنا">`;if(q.t==='order')body=`<div class="flow" id="order">${q.o.map((o,i)=>`<button class="order" data-i="${i}">${o}</button>`).join('')}</div><div class="tiny">اضغط العناصر بالترتيب الصحيح.</div>`;if(q.t==='match')body=`<div>${q.pairs.map(p=>`<div style="display:grid;grid-template-columns:1fr 150px;gap:8px;margin:8px 0"><b>${p[0]}</b><select class="input pair" data-a="${p[1]}"><option value="">اختر</option><option>أ</option><option>ؤ</option><option>ئ</option><option>ء</option></select></div>`).join('')}</div>`;return `<div class="question"><div id="fb" class="feedback"></div><div class="qhead"><div><div class="qbadge">تحقق ${check+1} من ${lesson[stage].checks.length}</div><div class="qtitle">${q.q}</div></div></div>${body}<button id="verify" class="verify">تحقق</button></div>`}
function bind(q){selected=null;let seq=[];document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=+b.dataset.i});document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.v==='true'});document.querySelectorAll('.order').forEach(b=>b.onclick=()=>{if(!b.classList.contains('sel')){b.classList.add('sel');seq.push(+b.dataset.i);b.textContent=seq.length+'. '+b.textContent}});document.getElementById('verify').onclick=()=>{let ok=false,answered=true;if(q.t==='mcq'){answered=selected!==null;ok=selected===q.a}if(q.t==='tf'){answered=selected!==null;ok=selected===q.a}if(q.t==='input'){const v=document.getElementById('ans').value;answered=v.trim()!=='';ok=norm(v)===norm(q.a)}if(q.t==='order'){answered=seq.length===q.o.length;ok=seq.join(',')===q.a}if(q.t==='match'){const ps=[...document.querySelectorAll('.pair')];answered=ps.every(s=>s.value!=='');ok=ps.every(s=>s.value===s.dataset.a)}const st=document.querySelector('.stage'),fb=document.getElementById('fb');if(!answered){fb.className='feedback no';fb.textContent='اختر إجابة أولًا';return}if(!ok){fb.className='feedback no';fb.textContent='حاول مرة أخرى';st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake');return}fb.className='feedback ok';fb.textContent='أحسنت ✓';mark();burst();st.classList.add('flash');setTimeout(nextCheck,520)}}
function simBind(){const moves=['ِ','ُ','َ','ْ'],h=document.getElementById('hmoves'),p=document.getElementById('pmoves'),s=document.getElementById('seat');h.innerHTML=moves.map(m=>`<button class="move ${m===hm?'on':''}" data-m="${m}">${m}</button>`).join('');p.innerHTML=moves.map(m=>`<button class="move ${m===pm?'on':''}" data-m="${m}">${m}</button>`).join('');h.querySelectorAll('.move').forEach(b=>b.onclick=()=>{hm=b.dataset.m;simBind()});p.querySelectorAll('.move').forEach(b=>b.onclick=()=>{pm=b.dataset.m;simBind()});s.textContent=seat[Math.max(strength[hm],strength[pm])]}
function renderLesson(){top();document.getElementById('app').innerHTML=`<section class="stage">${lesson[stage].html}${renderQuestion(lesson[stage].checks[check])}</section>`;bind(lesson[stage].checks[check]);if(stage===8)simBind()}
function renderQuiz(){top();const q=quiz[quizIndex];let body='';selected=null;if(q[0]==='mcq')body=`<div class="opts">${q[2].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;if(q[0]==='tf')body=`<div class="opts"><button class="tf" data-v="true">صح</button><button class="tf" data-v="false">خطأ</button></div>`;if(q[0]==='input')body=`<input id="qans" class="input" placeholder="اكتب إجابتك">`;document.getElementById('app').innerHTML=`<section class="stage"><div class="counter">السؤال ${quizIndex+1} من 25</div><h2 class="title">${q[1]}</h2>${body}<button id="qverify" class="verify">تحقق</button><div id="qfb" style="margin-top:10px;font-weight:800"></div><div class="dots">${quiz.map((_,i)=>`<span class="dot ${i<quizIndex?'done':''} ${i===quizIndex?'on':''}"></span>`).join('')}</div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=+b.dataset.i});document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.v==='true'});document.getElementById('qverify').onclick=()=>{let answered=true,ok=false;if(q[0]==='mcq'){answered=selected!==null;ok=selected===q[3]}if(q[0]==='tf'){answered=selected!==null;ok=selected===q[3]}if(q[0]==='input'){const v=document.getElementById('qans').value;answered=v.trim()!=='';ok=norm(v)===norm(q[3])}if(!answered){document.getElementById('qfb').textContent='اختر إجابة أولًا';return}if(ok){quizScore++;burst()}document.getElementById('qfb').textContent=ok?'✓ صحيح':'✕ غير صحيحة';setTimeout(()=>transition(()=>{quizIndex++;if(quizIndex<25)renderQuiz();else finishQuiz()}),420)}}
function finishQuiz(){attempts++;top();const score=Math.round(quizScore/25*100);document.getElementById('app').innerHTML=`<section class="stage"><h2 class="title">نتيجتك ${score}%</h2><p>${score>=70?'أحسنت، أتقنت المهارة.':'يمكنك استخدام محاولة أخرى لتحسين النتيجة.'}</p>${attempts<4?'<button id="again" class="verify">محاولة جديدة</button>':'<b>استخدمت المحاولات الأربع.</b>'}</section>`;const a=document.getElementById('again');if(a)a.onclick=()=>{quizIndex=0;quizScore=0;transition(renderQuiz)}}
function render(){top();stage<9?renderLesson():renderQuiz()}render();
})();
</script>
</body></html>
