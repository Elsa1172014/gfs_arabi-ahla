<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f9f8;color:#12353b}.page{max-width:1280px;margin:auto;padding:18px}.topline{height:6px;background:linear-gradient(90deg,#8e1d3c,#28357c,#0a3f89);border-radius:999px;margin-bottom:14px}.head{background:#fff;border:1px solid #dfe7e4;border-radius:22px;padding:24px;box-shadow:0 10px 26px #1231}.headgrid{display:grid;grid-template-columns:1fr 260px;gap:28px;align-items:center}.course h1{font-size:34px;margin:0 0 6px;color:#102f42}.meta{line-height:2;color:#38555b}.objective{font-size:20px;margin-top:18px}.ringwrap{text-align:center}.ring{width:140px;height:140px;margin:auto;position:relative}.ring svg{width:140px;height:140px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:12}.track{stroke:#e7ecea}.value{stroke:#14746f;stroke-linecap:round;transition:.4s}.pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#0c3440}.ringcap{font-weight:800;margin-top:6px}.small{font-size:13px;color:#647b80}.headbar{height:10px;background:#e7ece9;border-radius:999px;overflow:hidden;margin-top:20px}.headbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14746f,#1e88a8);transition:.4s}.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;margin-top:18px}.side{background:#fff;border:1px solid #dfe7e4;border-radius:20px;padding:16px;align-self:start;position:sticky;top:12px}.brand{background:linear-gradient(135deg,#0e2f54,#0b6f73);color:#fff;border-radius:16px;padding:14px;font-size:19px;font-weight:900;margin-bottom:12px}.navitem{display:flex;gap:10px;align-items:center;padding:12px;border-radius:13px;margin:7px 0;background:#f7f9f8;color:#62777b}.navitem.on{background:#e5f3ef;color:#0b5d58;font-weight:800}.navitem.done{background:#eef8f3;color:#17684d}.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#dfe7e4;font-weight:800}.navitem.on .dot,.navitem.done .dot{background:#14746f;color:#fff}.lock{margin-right:auto}.main{min-width:0}.card{background:#fff;border:1px solid #dfe7e4;border-radius:20px;padding:24px;box-shadow:0 8px 20px #1230;margin-bottom:18px}.eyebrow{display:inline-block;background:#e8f3f0;color:#0a665f;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:800}.title{font-size:28px;color:#113d53;margin:12px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.visual{border-radius:18px;padding:18px;background:linear-gradient(180deg,#f6fbfa,#edf6f3);border:1px solid #dceae6}.visual h3{margin-top:0;color:#0e5160}.wordcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.word{background:#fff;border:1px solid #dfe7e4;border-radius:16px;padding:16px;text-align:center}.word b{font-size:28px}.strength{display:flex;align-items:flex-end;gap:10px;justify-content:center;height:180px}.barv{width:70px;border-radius:16px 16px 6px 6px;display:flex;align-items:flex-end;justify-content:center;padding:10px;color:#fff;font-weight:900}.b4{height:160px;background:#0f766e}.b3{height:125px;background:#1687a7}.b2{height:90px;background:#b27b2b}.b1{height:55px;background:#9aa8a6}.question{margin-top:18px;padding:18px;border:1px solid #d8e4e0;border-radius:16px;background:#fbfcfc}.qtitle{font-weight:900;margin-bottom:12px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt,.tf,.chipbtn,.orderbtn{border:1px solid #d4dfdc;background:#fff;border-radius:12px;padding:11px;cursor:pointer;font-family:inherit;font-size:15px}.opt.sel,.tf.sel,.chipbtn.sel{border-color:#14746f;background:#e7f4f0}.feedback{margin-top:12px;padding:11px;border-radius:12px;display:none}.feedback.ok{display:block;background:#eaf7ef;color:#17633f}.feedback.no{display:block;background:#fff1ee;color:#8f382e}.next{margin-top:14px;border:0;background:#14746f;color:#fff;padding:12px 20px;border-radius:12px;font-weight:900;cursor:pointer}.next:disabled{opacity:.35;cursor:not-allowed}.video{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#10232a}.video iframe{width:100%;height:100%;border:0}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.map div{padding:18px;border-radius:18px;text-align:center;background:#f2f7f5;border:1px solid #dce7e4}.map .big{font-size:40px;font-weight:900}.simbox{display:grid;grid-template-columns:1fr 1fr;gap:14px}.moves{display:flex;gap:8px;flex-wrap:wrap}.move{width:55px;height:55px;border:2px solid #d7e1de;background:#fff;border-radius:14px;font-size:24px;cursor:pointer}.move.on{border-color:#14746f;background:#e6f4ef}.seat{font-size:58px;font-weight:900;text-align:center;padding:24px;background:#eef7f4;border-radius:18px}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.matchcol{display:grid;gap:8px}.matchbtn{border:1px solid #d7e0de;background:#fff;padding:10px;border-radius:12px;cursor:pointer}.matchbtn.sel{border-color:#14746f;background:#eaf6f2}.orderline{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.orderbtn{background:#f8faf9}.quizbox{background:#fff;border:1px solid #dce5e2;border-radius:20px;padding:24px}.counter{text-align:center;color:#60777b;margin-bottom:12px}.dots{display:flex;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}.qd{width:10px;height:10px;border-radius:50%;background:#d8e1df}.qd.on{background:#14746f}.qd.done{background:#86bfb0}.input{width:100%;padding:12px;border:1px solid #d6e0dd;border-radius:12px;font-family:inherit;font-size:16px}.heroimg{display:flex;align-items:center;justify-content:center;min-height:230px;background:linear-gradient(135deg,#0f3156,#0e716f);border-radius:18px;color:#fff;position:relative;overflow:hidden}.heroimg:before{content:"ء";font-size:220px;position:absolute;opacity:.08;left:7%;top:-30px}.heroimg .inner{position:relative;text-align:center}.heroimg .inner b{font-size:44px}.minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.miniCard{padding:16px;border-radius:16px;text-align:center;border:1px solid #dce7e4;background:#fff}.miniCard span{font-size:34px}.summary{padding:18px;border-radius:16px;background:#eef7f4}.hidden{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.headgrid{grid-template-columns:1fr}.grid2,.simbox{grid-template-columns:1fr}.wordcards,.map{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}.ringwrap{order:-1}}@media(max-width:600px){.page{padding:10px}.wordcards,.map,.minirow{grid-template-columns:1fr}.head{padding:16px}.card{padding:16px}.course h1{font-size:28px}}

<body>
<div class="page">
  <div class="topline"></div>
  <section class="head">
    <div class="headgrid">
      <div class="course">
        <h1>الهمزة المتوسطة</h1>
        <div class="meta">إملاء ورسم · الصف 10<br>الأسئلة النهائية: 25<br>النجاح: 70%<br>المحاولات: <span id="attemptsText">0 من 4</span></div>
        <div class="objective">أن يرسم الطالب الهمزة المتوسطة على صورتها الصحيحة معللًا اختياره بقاعدة أقوى الحركتين.</div>
      </div>
      <div class="ringwrap">
        <div class="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="48"></circle><circle id="ringValue" class="value" cx="60" cy="60" r="48"></circle></svg><div id="pct" class="pct">0%</div></div>
        <div class="ringcap">نسبة الحضور</div><div class="small">أكمل 100% ليفتح الاختبار</div>
      </div>
    </div>
    <div class="headbar"><i id="headbar"></i></div>
  </section>

  <div class="layout">
    <aside class="side"><div class="brand">GFS بالعربي أحلى</div><div id="nav"></div></aside>
    <main class="main"><div id="stage"></div></main>
  </div>
</div>

<script>
(function(){
const stages=[
 {n:'مقدمة وتمهيد',icon:'1'}, {n:'الفيديو والفهم',icon:'2'}, {n:'أقوى الحركتين',icon:'3'}, {n:'على الألف',icon:'4'}, {n:'على الواو',icon:'5'}, {n:'على الياء',icon:'6'}, {n:'حالات خاصة',icon:'7'}, {n:'خريطة المفاهيم',icon:'8'}, {n:'محاكاة وتطبيق',icon:'9'}, {n:'الاختبار النهائي',icon:'10'}
];
let stage=0, attempts=0, unlocked=0, quizIndex=0, quizScore=0, selected=null;
let hm='ْ',pm='ُ';
const strength={'ِ':4,'ُ':3,'َ':2,'ْ':1}, seat={4:'ئ',3:'ؤ',2:'أ',1:'ء'};
const state={};
function progress(){return Math.round((stage/9)*100)}
function top(){const p=progress(),c=2*Math.PI*48;document.getElementById('pct').textContent=p+'%';const r=document.getElementById('ringValue');r.style.strokeDasharray=c;r.style.strokeDashoffset=c*(1-p/100);document.getElementById('headbar').style.width=p+'%';document.getElementById('attemptsText').textContent=attempts+' من 4';document.getElementById('nav').innerHTML=stages.map((s,i)=>`<div class="navitem ${i===stage?'on':''} ${i<stage?'done':''}"><span class="dot">${i<stage?'✓':s.icon}</span><span>${s.n}</span><span class="lock">${i>stage?'🔒':''}</span></div>`).join('')}
function fb(ok,msg,id='fb'){const e=document.getElementById(id);e.className='feedback '+(ok?'ok':'no');e.textContent=msg}
function advance(){if(stage<9){stage++;unlocked=Math.max(unlocked,stage);selected=null;render();scrollTo({top:0,behavior:'smooth'})}}
function gateMCQ(correct,msg){return `<div class="question"><div class="qtitle">${msg}</div><div class="opts" id="opts"></div><div id="fb" class="feedback"></div><button id="next" class="next" disabled>تحقق وانتقل</button></div>`}
function setupMCQ(options,correct,why){const o=document.getElementById('opts'),n=document.getElementById('next');o.innerHTML=options.map((x,i)=>`<button class="opt" data-i="${i}">${x}</button>`).join('');o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{o.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=+b.dataset.i;n.disabled=false});n.onclick=()=>{if(selected===correct){fb(true,'✅ '+why);setTimeout(advance,650)}else{fb(false,'❌ حاول مرة أخرى. '+why)}}}
function render(){top();const x=document.getElementById('stage');
if(stage===0){x.innerHTML=`<section class="card"><span class="eyebrow">1. مقدمة وتمهيد</span><h2 class="title">لماذا تتغير صورة الهمزة؟</h2><div class="grid2"><div class="visual"><h3>لاحظ هذه الكلمات</h3><div class="wordcards"><div class="word"><b>سُئِل</b><div>ئ</div></div><div class="word"><b>سَأَل</b><div>أ</div></div><div class="word"><b>مُؤْمِن</b><div>ؤ</div></div><div class="word"><b>قراءة</b><div>ء</div></div></div><p>الفكرة البسيطة: شكل الهمزة لا يتغير عشوائيًا؛ بل تحكمه حركة الهمزة وحركة الحرف قبلها.</p></div><div class="heroimg"><div class="inner"><div>مهمتك اليوم</div><b>افهم القرار قبل أن تحفظ الشكل</b><p>لاحظ ← قارن ← اختر ← علّل</p></div></div></div>${gateMCQ(1,'سؤال تمهيدي: ما الذي سنقارنه قبل رسم الهمزة المتوسطة؟')}</section>`;setupMCQ(['عدد حروف الكلمة','حركة الهمزة وحركة ما قبلها','آخر حرف في الكلمة','طول الكلمة'],1,'نقارن الحركتين لأن الأقوى منهما يحدد كرسي الهمزة.')}
if(stage===1){x.innerHTML=`<section class="card"><span class="eyebrow">2. شاهد ثم تحقق</span><h2 class="title">فيديو قصير + تحقق مباشر</h2><div class="video"><iframe src="https://www.youtube.com/embed/N99RtSaAEj4" allowfullscreen></iframe></div><div class="minirow" style="margin-top:14px"><div class="miniCard"><span>👀</span><b>لاحظ</b><div>موضع الهمزة</div></div><div class="miniCard"><span>⚖️</span><b>قارن</b><div>قوة الحركتين</div></div><div class="miniCard"><span>✍️</span><b>طبّق</b><div>اختر الكرسي</div></div></div>${gateMCQ(2,'بعد الفيديو: أي حركة هي الأقوى؟')}</section>`;setupMCQ(['الفتحة','الضمة','الكسرة','السكون'],2,'ترتيب القوة يبدأ بالكسرة، ثم الضمة، ثم الفتحة، ثم السكون.')}
if(stage===2){x.innerHTML=`<section class="card"><span class="eyebrow">3. أقوى الحركتين</span><h2 class="title">إنفوجرافيك: سلّم القوة</h2><div class="grid2"><div class="visual"><div class="strength"><div class="barv b4">الكسرة</div><div class="barv b3">الضمة</div><div class="barv b2">الفتحة</div><div class="barv b1">السكون</div></div></div><div class="visual"><h3>خريطة القرار</h3><p>1) أحدد حركة الهمزة.</p><p>2) أحدد حركة الحرف السابق.</p><p>3) أقارن القوتين.</p><p>4) أختار كرسي الحركة الأقوى.</p></div></div><div class="question"><div class="qtitle">رتّب الخطوات من البداية إلى النهاية.</div><div class="orderline"><button class="orderbtn" data-v="3">أختار الكرسي</button><button class="orderbtn" data-v="1">أحدد حركة الهمزة</button><button class="orderbtn" data-v="4">أراجع الكلمة</button><button class="orderbtn" data-v="2">أحدد حركة ما قبلها</button></div><div class="small">اضغط الأزرار بالترتيب الصحيح.</div><div id="orderOut" class="summary" style="margin-top:10px">اختياراتك: —</div><div id="fb" class="feedback"></div></div></section>`;let seq=[];document.querySelectorAll('.orderbtn').forEach(b=>b.onclick=()=>{seq.push(+b.dataset.v);document.getElementById('orderOut').textContent='اختياراتك: '+seq.join(' ← ');if(seq.length===4){if(seq.join()==='1,2,3,4'){fb(true,'✅ ممتاز. الآن أنت جاهز للتطبيق.');setTimeout(advance,650)}else{fb(false,'❌ الترتيب غير صحيح. ابدأ من جديد.');seq=[];setTimeout(()=>document.getElementById('orderOut').textContent='اختياراتك: —',450)}}})}
if(stage===3){x.innerHTML=`<section class="card"><span class="eyebrow">4. الهمزة على الألف</span><h2 class="title">متى نكتبها على الألف؟</h2><div class="grid2"><div class="visual"><h3>مثال بصري</h3><div style="font-size:64px;text-align:center">سَ<span style="color:#a6402f">أَ</span>لَ</div><p>الهمزة مفتوحة وما قبلها مفتوح → الفتحة هي الأقوى → كرسيها الألف.</p></div><div class="visual"><h3>صورة ذهنية</h3><div style="font-size:70px;text-align:center">🪑 + َ = أ</div><p>إذا فازت الفتحة، تخيّل أنها تختار «كرسي الألف».</p></div></div>${gateMCQ(0,'اختر الكلمة التي كتبت همزتها على الألف كتابة صحيحة.')}</section>`;setupMCQ(['مَسْأَلَة','مُئْمِن','بِؤْر','سُأِل'],0,'في «مسألة» الهمزة مفتوحة وما قبلها ساكن؛ الفتحة أقوى من السكون.')}
if(stage===4){x.innerHTML=`<section class="card"><span class="eyebrow">5. الهمزة على الواو</span><h2 class="title">حين تفوز الضمة</h2><div class="grid2"><div class="visual"><div style="font-size:64px;text-align:center">مُ<span style="color:#14746f">ؤْ</span>مِن</div><p>الهمزة ساكنة وما قبلها مضموم → الضمة أقوى → نكتبها على الواو.</p></div><div class="visual"><h3>صح أم خطأ؟</h3><p>«في كلمة مُؤْمِن كتبت الهمزة على الواو لأن الضمة أقوى من السكون.»</p><div class="opts"><button class="tf" data-v="1">صح</button><button class="tf" data-v="0">خطأ</button></div><div id="fb" class="feedback"></div></div></div></section>`;document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(b.dataset.v==='1'){fb(true,'✅ صحيح. الضمة أقوى من السكون.');setTimeout(advance,650)}else fb(false,'❌ راجع سلم القوة.')})}
if(stage===5){x.innerHTML=`<section class="card"><span class="eyebrow">6. الهمزة على الياء</span><h2 class="title">حين تظهر الكسرة</h2><div class="grid2"><div class="visual"><div style="font-size:64px;text-align:center">بِ<span style="color:#1e6fa8">ئْ</span>ر</div><p>ما قبل الهمزة مكسور والهمزة ساكنة → الكسرة أقوى → تكتب على نبرة.</p></div><div class="visual"><h3>مطابقة سريعة</h3><div class="matchgrid"><div class="matchcol"><button class="matchbtn" data-a="ئ">الكسرة</button><button class="matchbtn" data-a="ؤ">الضمة</button><button class="matchbtn" data-a="أ">الفتحة</button></div><div class="matchcol"><button class="matchbtn target" data-b="أ">أ</button><button class="matchbtn target" data-b="ئ">ئ</button><button class="matchbtn target" data-b="ؤ">ؤ</button></div></div><div id="fb" class="feedback"></div></div></div></section>`;let left=null,right=null,matched=0;document.querySelectorAll('.matchbtn[data-a]').forEach(b=>b.onclick=()=>{left=b.dataset.a;document.querySelectorAll('.matchbtn[data-a]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});document.querySelectorAll('.target').forEach(b=>b.onclick=()=>{right=b.dataset.b;if(left&&left===right){b.disabled=true;b.classList.add('sel');document.querySelector(`.matchbtn[data-a="${left}"]`).disabled=true;matched++;left=null;if(matched===3){fb(true,'✅ اكتملت المطابقة بنجاح.');setTimeout(advance,650)}}else fb(false,'❌ هذه المطابقة غير صحيحة.')})}
if(stage===6){x.innerHTML=`<section class="card"><span class="eyebrow">7. حالات خاصة</span><h2 class="title">لا تحفظ القاعدة وحدها</h2><div class="map"><div><div class="big">ء</div><b>على السطر</b><p>مثل: قراءة</p></div><div><div class="big">ئ</div><b>على نبرة</b><p>مثل: بيئة</p></div><div><div class="big">ؤ</div><b>على واو</b><p>مثل: رؤوف</p></div><div><div class="big">أ</div><b>على ألف</b><p>مثل: مأمن</p></div></div><div class="question"><div class="qtitle">لغز: أي كلمة تختلف في رسم الهمزة عن الثلاث الأخرى؟</div><div class="opts"><button class="opt" data-v="0">سأل</button><button class="opt" data-v="1">رأس</button><button class="opt" data-v="2">مأمن</button><button class="opt" data-v="3">بئر</button></div><div id="fb" class="feedback"></div></div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.dataset.v==='3'){fb(true,'✅ صحيح. «بئر» على نبرة، والبقية على الألف.');setTimeout(advance,650)}else fb(false,'❌ ابحث عن الكلمة التي لا تجلس همزتها على الألف.')})}
if(stage===7){x.innerHTML=`<section class="card"><span class="eyebrow">8. خريطة المفاهيم</span><h2 class="title">الخريطة الكاملة في شاشة واحدة</h2><div class="map"><div><div class="big">ِ</div><b>الكسرة</b><p>الأقوى → ئ</p></div><div><div class="big">ُ</div><b>الضمة</b><p>→ ؤ</p></div><div><div class="big">َ</div><b>الفتحة</b><p>→ أ</p></div><div><div class="big">ْ</div><b>السكون</b><p>الأضعف</p></div></div><div class="summary"><b>قاعدة ذهبية:</b> لا تسأل أولًا «على ماذا كتبت الهمزة؟» بل اسأل «من الأقوى: حركة الهمزة أم حركة ما قبلها؟»</div>${gateMCQ(1,'تحقق أخير قبل المحاكاة: همزة مفتوحة وما قبلها مكسور. أين تكتب؟')}</section>`;setupMCQ(['أ','ئ','ؤ','ء'],1,'الكسرة أقوى من الفتحة؛ إذن تكتب على نبرة.')}
if(stage===8){x.innerHTML=`<section class="card"><span class="eyebrow">9. محاكاة وتطبيق</span><h2 class="title">مختبر «ميزان الهمزة»</h2><div class="simbox"><div class="visual"><h3>حركة الهمزة</h3><div class="moves" id="hm">${Object.keys(strength).map(m=>`<button class="move ${hm===m?'on':''}" data-m="${m}">${m}</button>`).join('')}</div><h3>حركة ما قبلها</h3><div class="moves" id="pm">${Object.keys(strength).map(m=>`<button class="move ${pm===m?'on':''}" data-m="${m}">${m}</button>`).join('')}</div></div><div class="visual"><div class="seat" id="seat">${seat[Math.max(strength[hm],strength[pm])]}</div><p style="text-align:center">غيّر الحركتين وشاهد الكرسي المتوقع.</p></div></div><div class="question"><div class="qtitle">اكتب الشكل الصحيح لكلمة: «سُ_ِلَ»</div><input id="typed" class="input" placeholder="اكتب الكلمة كاملة"><div id="fb" class="feedback"></div><button id="checkTyped" class="next">تحقق</button></div></section>`;document.querySelectorAll('#hm .move').forEach(b=>b.onclick=()=>{hm=b.dataset.m;render()});document.querySelectorAll('#pm .move').forEach(b=>b.onclick=()=>{pm=b.dataset.m;render()});document.getElementById('checkTyped').onclick=()=>{const v=document.getElementById('typed').value.trim().replace(/ـ/g,'');if(v==='سُئِلَ'||v==='سئل'||v==='سُئِل'){fb(true,'✅ ممتاز. اكتملت مرحلة التعلم وفتح الاختبار النهائي.');setTimeout(advance,700)}else fb(false,'❌ تذكّر: الهمزة مكسورة وما قبلها مضموم، والكسرة أقوى.')};}
if(stage===9){renderQuiz(x)}
}

 {t:'mcq',p:'اختر الكلمة الصحيحة.',o:['فأة','فؤة','فئة','فءة'],a:2},

];
function normalize(s){return (s||'').replace(/[ًٌٍَُِّْـ]/g,'').trim()}
function renderQuiz(x){const q=quiz[quizIndex];x.innerHTML=`<section class="quizbox"><div class="counter">السؤال ${quizIndex+1} من ${quiz.length}</div><h2 class="title" style="text-align:center">${q.p}</h2><div id="qa"></div><div id="qfb" class="feedback"></div><div class="dots">${quiz.map((_,i)=>`<span class="qd ${i===quizIndex?'on':''} ${i<quizIndex?'done':''}"></span>`).join('')}</div></section>`;const qa=document.getElementById('qa');if(q.t==='mcq'){qa.innerHTML=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;qa.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finishQuizAnswer(+b.dataset.i===q.a))}else if(q.t==='tf'){qa.innerHTML=`<div class="opts"><button class="tf" data-v="1">صح</button><button class="tf" data-v="0">خطأ</button></div>`;qa.querySelectorAll('.tf').forEach(b=>b.onclick=()=>finishQuizAnswer((b.dataset.v==='1')===q.a))}else{qa.innerHTML=`<input id="qtext" class="input" placeholder="اكتب إجابتك"><button id="qcheck" class="next">تحقق</button>`;document.getElementById('qcheck').onclick=()=>{const val=normalize(document.getElementById('qtext').value);let ok=Array.isArray(q.a)?q.a.map(normalize).includes(val):normalize(q.a)===val;finishQuizAnswer(ok)}}}
function finishQuizAnswer(ok){if(ok)quizScore++;const f=document.getElementById('qfb');f.className='feedback '+(ok?'ok':'no');f.textContent=ok?'✅ إجابة صحيحة':'❌ إجابة غير صحيحة';setTimeout(()=>{quizIndex++;if(quizIndex>=quiz.length){attempts++;showResult()}else render()},550)}
function showResult(){const x=document.getElementById('stage'),pct=Math.round(quizScore/quiz.length*100);x.innerHTML=`<section class="card"><h2 class="title">نتيجتك: ${pct}%</h2><div class="summary">أجبت إجابة صحيحة عن ${quizScore} من ${quiz.length}.</div>${pct>=70?'<p>🎉 أتقنت المهارة بنجاح.</p>':attempts<4?`<p>يمكنك إعادة المحاولة. المتبقي ${4-attempts}.</p><button id="retry" class="next">محاولة جديدة</button>`:'<p>استخدمت المحاولات الأربع.</p>'}</section>`;top();const r=document.getElementById('retry');if(r)r.onclick=()=>{quizIndex=0;quizScore=0;render()}}
render();
})();
