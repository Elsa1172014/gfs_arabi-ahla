<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الهمزة المتوسطة | GFS بالعربي أحلى</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f8fb;color:#15374a}.page{max-width:1380px;margin:auto;padding:18px}.brandline{height:7px;background:linear-gradient(90deg,#991d3b 0 42%,#103b86 58% 100%);border-radius:20px;margin-bottom:14px}.head{position:relative;background:#fff;border:1px solid #dfe5ea;border-radius:18px;padding:26px;overflow:hidden}.lion{position:absolute;left:22%;top:4px;font-size:160px;opacity:.035}.headgrid{display:grid;grid-template-columns:1fr 220px;gap:28px;align-items:center;position:relative}.course h1{margin:0 0 7px;font-size:34px;color:#0e315d}.meta{line-height:2;color:#34556b}.objective{font-size:20px;margin-top:18px}.ringwrap{text-align:center}.ring{width:135px;height:135px;position:relative;margin:auto}.ring svg{width:135px;height:135px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:11}.track{stroke:#e8eceb}.value{stroke:#0f7e78;stroke-linecap:round;transition:.35s}.pct{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:900;color:#0d2f5f}.ringcap{font-weight:800;margin-top:5px}.small{font-size:13px;color:#71818b}.headbar{height:8px;border-radius:99px;background:#e8eceb;overflow:hidden;margin-top:20px}.headbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#991d3b,#103b86);transition:.35s}.brandmini{display:flex;align-items:center;gap:10px;margin:16px 0}.brandbadge{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:14px;background:linear-gradient(90deg,#991d3b,#103b86);color:#fff;font-weight:900}.brandbadge .lionmark{font-size:27px}.stagebar{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding:4px 2px 10px;scrollbar-width:thin}.stagebar::-webkit-scrollbar{height:6px}.stagebar::-webkit-scrollbar-thumb{background:#c9d1d8;border-radius:10px}.crumb{flex:0 0 auto;font-size:13px;padding:8px 14px;border-radius:999px;background:#f0f2f5;color:#74818b;border:1px solid transparent}.crumb.on{background:#103b86;color:#fff;font-weight:900}.crumb.done{background:#f9e9ef;color:#991d3b}.stage{background:#fff;border:1px solid #dfe5ea;border-radius:18px;padding:24px;box-shadow:0 10px 28px rgba(20,40,70,.06)}.eyebrow{display:inline-block;padding:6px 12px;border-radius:999px;background:#eef3fb;color:#103b86;font-weight:800;font-size:13px}.title{font-size:28px;color:#103b86;margin:12px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.visual,.info{border-radius:16px;padding:18px;border:1px solid #dfe7ec;background:#fbfcfe}.video{aspect-ratio:16/9;background:#111;border-radius:16px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.pictures{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pic{background:#fff;border:1px solid #dfe5ea;border-radius:16px;padding:14px;text-align:center}.pic svg{width:100%;height:135px}.pic b{font-size:21px}.strength{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:220px;padding:15px}.sbar{width:82px;color:#fff;border-radius:18px 18px 7px 7px;display:flex;align-items:flex-end;justify-content:center;padding:12px;font-weight:900}.k4{height:185px;background:#991d3b}.k3{height:145px;background:#103b86}.k2{height:105px;background:#b47b2b}.k1{height:65px;background:#98a5ad}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.map>div{background:#f7f9fc;border:1px solid #dfe5ea;border-radius:16px;padding:18px;text-align:center}.map strong{font-size:37px;display:block}.flow{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0}.flow span{padding:12px 16px;border-radius:14px;background:#eef3fb;border:1px solid #d4deed}.question{position:relative;margin-top:20px;border:1px solid #dce4e8;border-radius:16px;padding:18px;background:#fbfcfd}.qtitle{font-weight:900;font-size:17px;margin-bottom:12px;padding-left:110px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt,.tf,.order,.verify{font:inherit;border:1px solid #d6dfe4;background:#fff;border-radius:12px;padding:11px;cursor:pointer}.opt.sel,.tf.sel,.order.sel{border-color:#103b86;background:#eef3fb}.input{width:100%;padding:12px;border:1px solid #d6dfe4;border-radius:12px;font:inherit}.verify{margin-top:13px;border:0;background:#103b86;color:#fff;font-weight:900}.verify:disabled{opacity:.35}.feedback{position:absolute;left:14px;top:14px;display:none;padding:8px 12px;border-radius:999px;font-weight:900}.feedback.ok{display:block;background:#e8f6ee;color:#17643e}.feedback.no{display:block;background:#fff0ed;color:#9b3a2f}.checkcount{text-align:center;color:#71818b;font-size:13px;margin-top:8px}.quiz{background:#fff;border:1px solid #dfe5ea;border-radius:18px;padding:24px}.counter{text-align:center;color:#617585;margin-bottom:12px}.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:18px}.dot{width:9px;height:9px;border-radius:50%;background:#d9dfe3}.dot.on{background:#103b86}.dot.done{background:#991d3b}.summary{padding:16px;border-radius:14px;background:#eef3fb}.hidden{display:none!important}@media(max-width:850px){.headgrid,.grid2{grid-template-columns:1fr}.pictures,.map{grid-template-columns:1fr 1fr}.ringwrap{order:-1}.opts{grid-template-columns:1fr}}@media(max-width:560px){.page{padding:10px}.pictures,.map{grid-template-columns:1fr}.stage{padding:16px}.course h1{font-size:28px}}
</style></head><body><div class="page"><div class="brandline"></div><section class="head"><div class="lion">🦁</div><div class="headgrid"><div class="course"><h1>الهمزة المتوسطة</h1><div class="meta">إملاء ورسم · الصف 10<br>الأسئلة النهائية: 25<br>النجاح: 70%<br>المحاولات: <span id="attemptsText">0 من 4</span></div><div class="objective">أن يرسم الطالب الهمزة المتوسطة على صورتها الصحيحة معللًا اختياره بقاعدة أقوى الحركتين.</div></div><div class="ringwrap"><div class="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="48"></circle><circle id="ringValue" class="value" cx="60" cy="60" r="48"></circle></svg><div id="pct" class="pct">0%</div></div><div class="ringcap">نسبة الحضور</div><div class="small">أكمل 100% ليفتح الاختبار</div></div></div><div class="headbar"><i id="headbar"></i></div></section><div class="brandmini"><div class="brandbadge"><span class="lionmark">🦁</span><span>GFS بالعربي أحلى</span></div><div class="small">GEMS Founders School</div></div><div id="crumbs" class="stagebar"></div><main id="app"></main></div><script>
(function(){
const names=['مقدمة وتمهيد','الفيديو والفهم','أقوى الحركتين','على الألف','على الواو','على الياء','حالات خاصة','خريطة المفاهيم','محاكاة وتطبيق','الاختبار النهائي'];
let stage=0,check=0,attempts=0,quizIndex=0,quizScore=0,selected=null;const done=new Set();
const lesson=[
{html:`<span class="eyebrow">1. مقدمة وتمهيد</span><h2 class="title">نلاحظ قبل أن نحفظ</h2><div class="grid2"><div class="info"><h3>انظر إلى الصور والكلمات</h3><div class="pictures"><div class="pic"><svg viewBox="0 0 180 120"><rect x="25" y="62" width="130" height="35" rx="8" fill="#a66b3d"/><ellipse cx="90" cy="62" rx="65" ry="17" fill="#c88a55"/><ellipse cx="90" cy="62" rx="44" ry="10" fill="#4b89c8"/><path d="M45 58 Q90 10 135 58" fill="none" stroke="#7b4d2a" stroke-width="8"/></svg><b>بِئْر</b></div><div class="pic"><svg viewBox="0 0 180 120"><circle cx="90" cy="38" r="22" fill="#f1c8a5"/><path d="M55 115 Q60 60 90 60 Q120 60 125 115" fill="#103b86"/><circle cx="82" cy="36" r="3"/><circle cx="98" cy="36" r="3"/></svg><b>مُؤْمِن</b></div><div class="pic"><svg viewBox="0 0 180 120"><rect x="25" y="25" width="130" height="75" rx="8" fill="#fff3d4" stroke="#b47b2b"/><path d="M45 45h90M45 62h80M45 79h65" stroke="#a68442" stroke-width="5"/></svg><b>مَسْأَلَة</b></div></div><p>شكل الهمزة لا يتغير عشوائيًا؛ بل تحكمه حركة الهمزة وحركة الحرف الذي قبلها.</p></div><div class="visual"><h3>الفكرة في أبسط صورة</h3><div class="flow"><span>ألاحظ حركة الهمزة</span><b>←</b><span>ألاحظ حركة ما قبلها</span><b>←</b><span>أقارن القوة</span><b>←</b><span>أختار الكرسي</span></div><div class="summary">نفهم السبب قبل أن نحفظ الشكل.</div></div></div>`,checks:[{t:'mcq',q:'ما الذي نحتاج إلى مقارنته؟',o:['عدد الحروف','حركة الهمزة وحركة ما قبلها','آخر حرف','طول الكلمة'],a:1},{t:'tf',q:'شكل الهمزة المتوسطة يتغير عشوائيًا.',a:false}]},
{html:`<span class="eyebrow">2. الفيديو والفهم</span><h2 class="title">شاهد ثم أثبت أنك فهمت</h2><div class="video"><iframe src="https://www.youtube.com/embed/N99RtSaAEj4" title="شرح الهمزة المتوسطة" allowfullscreen></iframe></div><p class="small">بعد المشاهدة أجب عن أسئلة التحقق. الإجابة الصحيحة تنقلك تلقائيًا إلى السؤال التالي.</p>`,checks:[{t:'mcq',q:'أي حركتين نضعهما في الميزان؟',o:['حركة أول حرف وآخر حرف','حركة الهمزة وما قبلها','حركة ما بعدها فقط','السكون فقط'],a:1},{t:'order',q:'رتب خطوات القرار.',o:['أحدد الحركتين','أقارن القوة','أختار الكرسي'],a:'0,1,2'}]},
{html:`<span class="eyebrow">3. أقوى الحركتين</span><h2 class="title">إنفوجرافيك قوة الحركات</h2><div class="grid2"><div class="visual"><div class="strength"><div class="sbar k4">الكسرة<br>ئ</div><div class="sbar k3">الضمة<br>ؤ</div><div class="sbar k2">الفتحة<br>أ</div><div class="sbar k1">السكون</div></div><p style="text-align:center"><b>الكسرة ← الضمة ← الفتحة ← السكون</b></p></div><div class="info"><h3>كيف أستخدم السلم؟</h3><p>أحدد الحركتين، ثم أختار الأقوى، وبعدها أكتب الهمزة على الكرسي المناسب.</p><div class="map"><div><strong>ِ</strong>ئ</div><div><strong>ُ</strong>ؤ</div><div><strong>َ</strong>أ</div><div><strong>ْ</strong>الأضعف</div></div></div></div>`,checks:[{t:'mcq',q:'أي الحركات أقوى؟',o:['السكون','الفتحة','الضمة','الكسرة'],a:3},{t:'mcq',q:'ما الكرسي المناسب للضمة؟',o:['أ','ؤ','ئ','ء'],a:1}]},
{html:`<span class="eyebrow">4. على الألف</span><h2 class="title">متى تكتب الهمزة على الألف؟</h2><div class="summary">إذا كانت الفتحة هي الأقوى، جلست الهمزة على الألف: <b>سَأَلَ – مَسْأَلَة</b>.</div>`,checks:[{t:'mcq',q:'اختر الكلمة الصحيحة.',o:['سؤل','سأل','سئل','سءل'],a:1},{t:'tf',q:'الفتحة تناسب الألف.',a:true}]},
{html:`<span class="eyebrow">5. على الواو</span><h2 class="title">متى تكتب الهمزة على الواو؟</h2><div class="summary">إذا كانت الضمة هي الأقوى، جلست الهمزة على الواو: <b>مُؤْمِن – رُؤْيَة</b>.</div>`,checks:[{t:'mcq',q:'اختر الرسم الصحيح.',o:['مُأْمِن','مُؤْمِن','مُئْمِن','مُءْمِن'],a:1}]},
{html:`<span class="eyebrow">6. على الياء</span><h2 class="title">متى تكتب الهمزة على النبرة؟</h2><div class="summary">إذا كانت الكسرة هي الأقوى، جلست الهمزة على النبرة: <b>بِئْر – فِئَة – سُئِلَ</b>.</div>`,checks:[{t:'mcq',q:'أي كلمة كتبت همزتها على نبرة؟',o:['رؤية','بئر','سأل','مؤمن'],a:1},{t:'tf',q:'الكسرة أقوى من الضمة.',a:true}]},
{html:`<span class="eyebrow">7. حالات خاصة</span><h2 class="title">انتبه للحالات التي تحتاج مراجعة</h2><div class="summary">القاعدة العامة تبدأ بمقارنة الحركتين، ثم نراجع الحالات الخاصة عند الحاجة.</div>`,checks:[{t:'mcq',q:'ما الخطوة الأولى دائمًا؟',o:['أختار الكرسي','أحدد الحركتين','أنظر لآخر الكلمة','أعد الحروف'],a:1}]},
{html:`<span class="eyebrow">8. خريطة المفاهيم</span><h2 class="title">الخريطة في لقطة واحدة</h2><div class="map"><div><strong>الكسرة</strong>ئ</div><div><strong>الضمة</strong>ؤ</div><div><strong>الفتحة</strong>أ</div><div><strong>السكون</strong>الأضعف</div></div>`,checks:[{t:'mcq',q:'إذا اجتمعت كسرة وفتحة، من يفوز؟',o:['الفتحة','الكسرة','السكون','لا أحد'],a:1}]},
{html:`<span class="eyebrow">9. محاكاة وتطبيق</span><h2 class="title">تحدي القرار</h2><div class="grid2"><div class="visual"><h3>همزة ساكنة + حرف قبلها مضموم</h3><div class="summary">الضمة أقوى من السكون، إذن الكرسي هو الواو.</div></div><div class="visual"><h3>همزة مفتوحة + حرف قبلها مكسور</h3><div class="summary">الكسرة أقوى من الفتحة، إذن الكرسي هو النبرة.</div></div></div>`,checks:[{t:'mcq',q:'همزة ساكنة وما قبلها مضموم. اختر الكرسي.',o:['أ','ؤ','ئ','ء'],a:1},{t:'input',q:'اكتب الكلمة الصحيحة: بِ...ر',a:'بئر'}]}
];
const quiz=[['mcq','في كلمة «سُئِلَ» ما الحركة الأقوى؟',['الكسرة','الضمة','الفتحة','السكون'],0],['tf','الكسرة أقوى من الضمة.',null,true],['input','اكتب الكلمة الصحيحة: مُ...مِن',null,'مؤمن']];while(quiz.length<25)quiz.push(['mcq','اختر كرسي الهمزة عندما تكون الكسرة هي الأقوى.',['أ','ؤ','ئ','ء'],2]);
const totalChecks=lesson.reduce((n,s)=>n+s.checks.length,0);
function norm(s){return String(s||'').replace(/[ًٌٍَُِّْـ\s]/g,'').replace(/[إأآ]/g,'ا')}
function progress(){return Math.round(done.size/totalChecks*100)}
function top(){const p=progress(),c=2*Math.PI*48;document.getElementById('pct').textContent=p+'%';const r=document.getElementById('ringValue');r.style.strokeDasharray=c;r.style.strokeDashoffset=c*(1-p/100);document.getElementById('headbar').style.width=p+'%';document.getElementById('attemptsText').textContent=attempts+' من 4';document.getElementById('crumbs').innerHTML=names.map((n,i)=>`<span class="crumb ${i===stage?'on':''} ${i<stage?'done':''}">${i+1}. ${n}</span>`).join('')}
function feedback(ok){const e=document.getElementById('fb');e.className='feedback '+(ok?'ok':'no');e.textContent=ok?'✓ صحيح':'↻ حاول مرة أخرى'}
function nextCheck(){if(check+1<lesson[stage].checks.length){check++;selected=null;renderLesson()}else{stage++;check=0;selected=null;render()}requestAnimationFrame(()=>document.querySelector('.question')?.scrollIntoView({behavior:'smooth',block:'center'}))}
function renderQuestion(q){let body='';selected=null;if(q.t==='mcq')body=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;if(q.t==='tf')body=`<div class="opts"><button class="tf" data-v="true">صح</button><button class="tf" data-v="false">خطأ</button></div>`;if(q.t==='input')body=`<input id="ans" class="input" placeholder="اكتب الإجابة هنا">`;if(q.t==='order')body=`<div id="order" class="flow">${q.o.map((o,i)=>`<button class="order" data-i="${i}">${o}</button>`).join('')}</div><div class="small">اضغط العناصر بالترتيب الصحيح.</div>`;return `<div class="question"><div id="fb" class="feedback"></div><div class="qtitle">${q.q}</div>${body}<button id="verify" class="verify">تحقق</button><div class="checkcount">سؤال متابعة ${check+1} من ${lesson[stage].checks.length}</div></div>`}
function bindQuestion(q){const v=document.getElementById('verify');let seq=[];document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=+b.dataset.i});document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.v==='true'});document.querySelectorAll('.order').forEach(b=>b.onclick=()=>{if(!b.classList.contains('sel')){b.classList.add('sel');seq.push(+b.dataset.i);b.textContent=(seq.length)+'. '+b.textContent}});v.onclick=()=>{let ok=false;if(q.t==='mcq')ok=selected===q.a;if(q.t==='tf')ok=selected===q.a;if(q.t==='input')ok=norm(document.getElementById('ans').value)===norm(q.a);if(q.t==='order')ok=seq.join(',')===q.a;feedback(ok);if(ok){done.add(stage+'-'+check);top();v.disabled=true;setTimeout(nextCheck,600)}else{v.disabled=false;if(q.t==='order'){seq=[];document.querySelectorAll('.order').forEach((b,i)=>{b.classList.remove('sel');b.textContent=q.o[i]})}}}}
function renderLesson(){top();const s=lesson[stage];document.getElementById('app').innerHTML=`<section class="stage">${s.html}${renderQuestion(s.checks[check])}</section>`;bindQuestion(s.checks[check])}
function renderQuiz(){top();const q=quiz[quizIndex];let body='';selected=null;if(q[0]==='mcq')body=`<div class="opts">${q[2].map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;if(q[0]==='tf')body=`<div class="opts"><button class="tf" data-v="true">صح</button><button class="tf" data-v="false">خطأ</button></div>`;if(q[0]==='input')body=`<input id="qans" class="input" placeholder="اكتب إجابتك">`;document.getElementById('app').innerHTML=`<section class="quiz"><div class="counter">السؤال ${quizIndex+1} من 25</div><h2 class="title">${q[1]}</h2>${body}<button id="qverify" class="verify">تحقق</button><div id="qfb" class="feedback"></div><div class="dots">${quiz.map((_,i)=>`<span class="dot ${i<quizIndex?'done':''} ${i===quizIndex?'on':''}"></span>`).join('')}</div></section>`;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=+b.dataset.i});document.querySelectorAll('.tf').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.v==='true'});document.getElementById('qverify').onclick=()=>{let ok=q[0]==='mcq'?selected===q[3]:q[0]==='tf'?selected===q[3]:norm(document.getElementById('qans').value)===norm(q[3]);const f=document.getElementById('qfb');f.className='feedback '+(ok?'ok':'no');f.textContent=ok?'✓ صحيح':'↻ حاول مرة أخرى';if(ok){quizScore++;document.getElementById('qverify').disabled=true;setTimeout(()=>{quizIndex++;if(quizIndex<25)renderQuiz();else finishQuiz()},500)}}}
function finishQuiz(){attempts++;top();const p=Math.round(quizScore/25*100);document.getElementById('app').innerHTML=`<section class="quiz"><h2 class="title">نتيجتك ${p}%</h2><p>${p>=70?'أحسنت، أتقنت المهارة.':'راجع الشرح ثم حاول مرة أخرى.'}</p>${attempts<4?'<button id="again" class="verify">محاولة جديدة</button>':'<b>استخدمت المحاولات الأربع.</b>'}</section>`;const a=document.getElementById('again');if(a)a.onclick=()=>{quizIndex=0;quizScore=0;renderQuiz()}}
function render(){top();if(stage<9)renderLesson();else renderQuiz()}render();})();
</script></body></html>
